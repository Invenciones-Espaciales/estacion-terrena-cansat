# ============================================================
# CanSat CONAE Ground Station Configuration
# Meets CONAE / ENACOM regulations & Bases §4-§7
# ============================================================

team:
  id: "1000"              # 4-digit Team ID (e.g., '1000')
  name: "CanSat Team"
  mode: "F"               # 'F' for Flight Mode, 'S' for Simulation Mode

serial:
  port: "/tmp/cansat_uart" # Virtual UART simulator or hardware (/dev/ttyACM0, /dev/ttyUSB0, COM3)
  fallback_port: "/dev/ttyACM0"
  baudrate: 115200        # UART Baudrate (115200 or 9600 for LoRa transceivers)
  reconnect_delay: 2.0    # Reconnection retry interval in seconds
  timeout: 1.0

websocket:
  host: "0.0.0.0"         # Listen on all network interfaces
  port: 8080              # Port for local browser connection (8080)

storage:
  database: "data/telemetry.db"
  primary_csv: "data/Flight_1000.csv"         # Primary CSV on Ground Station notebook (G2)
  backup_csv: "data/backup/Flight_1000.csv"   # Backup CSV on secondary storage/USB (G2)

radio:
  band: "915MHz"          # ENACOM authorized: '915MHz' (915-928 MHz) or '2.4GHz' (2400-2483.5 MHz)
  frequency_mhz: 915.0    # Operating frequency (reconfigurable for field coexistence)
  power_dbm: 20           # Transmit power (up to +20 dBm / 100 mW)
  addressing: "p2p"       # Point-to-point addressing (no broadcast, X2)
  cansat_address: 1000    # CanSat node ID
  station_address: 1      # Ground station node ID

mission_limits:
  altitude_max_m: 1000.0  # Mission ceiling (~500 - 1000 m)
  descent_c3_nominal_ms: 15.0  # Phase C3 descent rate: 15 ± 3 m/s
  descent_c3_tol_ms: 3.0
  descent_c4_nominal_ms: 5.0   # Phase C4 descent rate: 5 ± 3 m/s
  descent_c4_tol_ms: 3.0
  voltage_min_v: 3.3
  voltage_nominal_v: 3.7
  voltage_max_v: 4.2
  current_max_a: 1.0

charts:
  scaling_mode: "ratchet"
  altitude:
    pad_max_m: 30.0
    expected_apogee_m: 1000.0
    step_m: 200.0
  voltage:
    min_v: 3.0
    max_v: 4.5
  current:
    min_a: 0.0
    max_a: 0.8
  acceleration:
    min_ms2: -30.0
    max_ms2: 50.0
  rotation:
    min_degs: -360.0
    max_degs: 360.0
