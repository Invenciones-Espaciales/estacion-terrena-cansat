name: "CanSat CONAE Telemetry Frame"
id: 1000
description: "Official CONAE CanSat 1 Hz Telemetry Specification (Plain-text CSV / Binary)"
format: "ascii_csv" # "ascii_csv" or "binary"

fields:
  - index: 0
    name: "TEAM_ID"
    description: "4-digit assigned Team ID (e.g. '1000')"
    type: "string"
    expected_value: "1000"
    unit: ""

  - index: 1
    name: "MISSION_TIME"
    description: "UTC time formatted as hh:mm:ss with 1 second resolution"
    type: "time_utc"
    unit: "UTC"

  - index: 2
    name: "PACKET_COUNT"
    description: "Total packets transmitted since boot, persistent across reboots"
    type: "uint32"
    unit: "pkts"

  - index: 3
    name: "MODE"
    description: "'F' for Flight mode, 'S' for Simulation mode"
    type: "string"
    allowed_values: ["F", "S"]
    unit: ""

  - index: 4
    name: "STATE"
    description: "Flight software operating state"
    type: "string"
    allowed_values:
      - "LAUNCH_PAD"
      - "ASCENT"
      - "APOGEE"
      - "DESCENT"
      - "PROBE_RELEASE"
      - "PAYLOAD_RELEASE"
      - "LANDED"
    unit: ""

  - index: 5
    name: "ALTITUDE"
    description: "Altitude in meters relative to ground level at launch site (0.1 m resolution)"
    type: "float32"
    scale: 1.0
    unit: "m"

  - index: 6
    name: "TEMPERATURE"
    description: "Temperature in degrees Celsius (0.1 °C resolution)"
    type: "float32"
    scale: 1.0
    unit: "°C"

  - index: 7
    name: "PRESSURE"
    description: "Atmospheric pressure in kPa (0.1 kPa resolution)"
    type: "float32"
    scale: 1.0
    unit: "kPa"

  - index: 8
    name: "VOLTAGE"
    description: "Power bus voltage in Volts (0.1 V resolution)"
    type: "float32"
    scale: 1.0
    unit: "V"

  - index: 9
    name: "CURRENT"
    description: "Battery current in Amperes (0.01 A resolution)"
    type: "float32"
    scale: 1.0
    unit: "A"

  - index: 10
    name: "GYRO_R"
    description: "Gyroscope Roll rate in degrees per second"
    type: "float32"
    scale: 1.0
    unit: "°/s"

  - index: 11
    name: "GYRO_P"
    description: "Gyroscope Pitch rate in degrees per second"
    type: "float32"
    scale: 1.0
    unit: "°/s"

  - index: 12
    name: "GYRO_Y"
    description: "Gyroscope Yaw rate in degrees per second"
    type: "float32"
    scale: 1.0
    unit: "°/s"

  - index: 13
    name: "ACCEL_R"
    description: "Accelerometer Roll / X reading in m/s^2"
    type: "float32"
    scale: 1.0
    unit: "m/s²"

  - index: 14
    name: "ACCEL_P"
    description: "Accelerometer Pitch / Y reading in m/s^2"
    type: "float32"
    scale: 1.0
    unit: "m/s²"

  - index: 15
    name: "ACCEL_Y"
    description: "Accelerometer Yaw / Z reading in m/s^2"
    type: "float32"
    scale: 1.0
    unit: "m/s²"

  - index: 16
    name: "GPS_TIME"
    description: "GPS UTC time formatted as hh:mm:ss (1s resolution)"
    type: "time_utc"
    unit: "UTC"

  - index: 17
    name: "GPS_ALTITUDE"
    description: "GPS altitude in meters MSL (0.1 m resolution)"
    type: "float32"
    scale: 1.0
    unit: "m"

  - index: 18
    name: "GPS_LATITUDE"
    description: "GPS latitude in decimal degrees (0.0001 deg resolution)"
    type: "float64"
    scale: 1.0
    unit: "°"

  - index: 19
    name: "GPS_LONGITUDE"
    description: "GPS longitude in decimal degrees (0.0001 deg resolution)"
    type: "float64"
    scale: 1.0
    unit: "°"

  - index: 20
    name: "GPS_SATS"
    description: "Number of GPS satellites tracked"
    type: "uint8"
    unit: "sats"

  - index: 21
    name: "CMD_ECHO"
    description: "Text of last telecommand received and processed by CanSat"
    type: "string"
    unit: ""

  - index: 22
    name: "OPTIONAL_DATA"
    description: "Optional payload sensors or diagnostic metrics"
    type: "string"
    optional: true
    unit: ""
