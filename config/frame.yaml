name: "Trama"
id: 1
description: "Telemetría de alta frecuencia"

frame:
  length: 29
  byte_order: "big_endian"

  crc:
    enabled: true
    algorithm: "CRC-16/CCITT-FALSE"
    polynomial: 0x1021
    initial_value: 0xFFFF
    final_xor: 0x0000
    reflect_input: false
    reflect_output: false

    offset: 27
    length: 2
    byte_order: "big_endian"

    calculate_from: 0
    calculate_to: 26

fields:

  - name: "rocket_id"
    description: "Identificador del cohete"
    offset: 0
    length: 1
    type: "uint8"

  - name: "frame_type"
    description: "Tipo de trama"
    offset: 1
    length: 1
    type: "uint8"
    expected_value: 0x01

  - name: "frame_number"
    description: "Número secuencial de trama"
    offset: 2
    length: 2
    type: "uint16"

  - name: "timestamp"
    description: "Tiempo desde el inicio"
    offset: 4
    length: 4
    type: "uint32"
    unit: "ms"

  - name: "accel_x"
    description: "Aceleración en eje X"
    offset: 8
    length: 2
    type: "int16"
    scale: 0.001
    offset_value: 0
    unit: "g"

  - name: "accel_y"
    description: "Aceleración en eje Y"
    offset: 10
    length: 2
    type: "int16"
    scale: 0.001
    offset_value: 0
    unit: "g"

  - name: "accel_z"
    description: "Aceleración en eje Z"
    offset: 12
    length: 2
    type: "int16"
    scale: 0.0005
    offset_value: 0
    unit: "g"

  - name: "latitude"
    description: "Latitud GPS"
    offset: 14
    length: 4
    type: "int32"
    scale: 0.000001
    offset_value: 0
    unit: "deg"

  - name: "longitude"
    description: "Longitud GPS"
    offset: 18
    length: 4
    type: "int32"
    scale: 0.000001
    offset_value: 0
    unit: "deg"

  - name: "altitude"
    description: "Altitud GPS"
    offset: 22
    length: 2
    type: "int16"
    scale: 1
    offset_value: 0
    unit: "m"

  - name: "status"
    description: "Estado actual del cohete"
    offset: 24
    length: 1
    type: "uint8"

    values:
      0x00: "STANDBY"
      0x01: "POWERED"
      0x02: "BURNOUT"
      0x03: "BURNOUT"
      0x04: "APOGEE"
      0x07: "APOGEE"
      0x08: "DROGUE_ORD"
      0x0F: "DROGUE_ORD"
      0x10: "DROGUE_CONF"
      0x1F: "DROGUE_CONF"
      0x20: "MAIN_ORD"
      0x3F: "MAIN_ORD"
      0x40: "MAIN_CONF"
      0x7F: "MAIN_CONF"
      0x80: "LANDED"
      0xFF: "LANDED"

  - name: "rssi"
    description: "Potencia de señal RF"
    offset: 25
    length: 1
    type: "int8"
    unit: "dBm"

  - name: "satellites"
    description: "Cantidad de satélites GNSS"
    offset: 26
    length: 1
    type: "uint8"
    unit: ""
