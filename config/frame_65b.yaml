name: "Trama"
id: 1
description: "Telemetría LoRa 65 bytes definitiva"

frame:
  length: 65
  byte_order: "little_endian"
  sync: "0xAA"

  crc:
    enabled: true
    algorithm: "CRC-16/CCITT-FALSE"
    polynomial: 0x1021
    initial_value: 0xFFFF
    final_xor: 0x0000
    reflect_input: false
    reflect_output: false

    offset: 63
    length: 2
    byte_order: "little_endian"

    calculate_from: 0
    calculate_to: 62

fields:

  - name: "sync"
    description: "Byte fijo de sincronización para filtrado de ruido"
    offset: 0
    length: 1
    type: "uint8"
    expected_value: 0xAA

  - name: "frame_number"
    description: "ID de Trama secuencial incremental (0..65535)"
    offset: 1
    length: 2
    type: "uint16"

  - name: "timestamp"
    description: "Tiempo transcurrido desde el inicio del vuelo en milisegundos"
    offset: 3
    length: 4
    type: "uint32"
    unit: "ms"

  - name: "status"
    description: "Etapa actual del vuelo (máquina de estados)"
    offset: 7
    length: 1
    type: "uint8"
    values:
      0x00: "STANDBY"
      0x01: "POWERED"
      0x02: "BURNOUT"
      0x03: "BURNOUT"
      0x04: "APOGEE"
      0x07: "APOGEE"
      0x08: "DROGUE_ORD"
      0x0F: "DROGUE_ORD"
      0x10: "DROGUE_CONF"
      0x1F: "DROGUE_CONF"
      0x20: "MAIN_ORD"
      0x3F: "MAIN_ORD"
      0x40: "MAIN_CONF"
      0x7F: "MAIN_CONF"
      0x80: "LANDED"
      0xFF: "LANDED"

  - name: "pressure"
    description: "Presión atmosférica en hPa entregada por BMP280"
    offset: 8
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "hPa"

  - name: "altura_actual"
    description: "Altitud barométrica en metros respecto al punto de calibración"
    offset: 12
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "m"

  - name: "accel_x"
    description: "Aceleración lineal en eje X de la IMU"
    offset: 16
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "g"

  - name: "accel_y"
    description: "Aceleración lineal en eje Y de la IMU"
    offset: 20
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "g"

  - name: "accel_z"
    description: "Aceleración lineal en eje Z de la IMU"
    offset: 24
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "g"

  - name: "gyro_x"
    description: "Velocidad angular en eje X de la IMU"
    offset: 28
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "deg/s"

  - name: "gyro_y"
    description: "Velocidad angular en eje Y de la IMU"
    offset: 32
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "deg/s"

  - name: "gyro_z"
    description: "Velocidad angular en eje Z de la IMU"
    offset: 36
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "deg/s"

  - name: "temp_imu"
    description: "Temperatura interna del sensor IMU"
    offset: 40
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "°C"

  - name: "latitude"
    description: "Coordenada geográfica de latitud obtenida del GPS"
    offset: 44
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "deg"

  - name: "longitude"
    description: "Coordenada geográfica de longitud obtenida del GPS"
    offset: 48
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "deg"

  - name: "altitud_gps"
    description: "Altitud absoluta sobre el nivel del mar entregada por GPS"
    offset: 52
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "m"

  - name: "satellites"
    description: "Cantidad de satélites conectados (calidad de fix)"
    offset: 56
    length: 1
    type: "uint8"
    unit: ""

  - name: "ground_speed"
    description: "Velocidad sobre el suelo entregada directamente por GPS"
    offset: 57
    length: 4
    type: "float32"
    scale: 1.0
    offset_value: 0
    unit: "m/s"

  - name: "pin_frenado"
    description: "Estado lógico actual del pin de frenado (paracaídas drogue)"
    offset: 61
    length: 1
    type: "uint8"
    values:
      0: "DESACTIVADO"
      1: "ACTIVADO"

  - name: "pin_principal"
    description: "Estado lógico actual del pin principal (paracaídas principal)"
    offset: 62
    length: 1
    type: "uint8"
    values:
      0: "DESACTIVADO"
      1: "ACTIVADO"
